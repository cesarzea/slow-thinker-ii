[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
name = "slow-thinker-sequence"
version = "0.1.0.dev1"
description = "Stateless finite-sequence controller for collaborative agent experiments."
requires-python = ">=3.13,<3.14"
authors = [{name = "Cesar Zea"}]
dependencies = ["slow-thinker-host==0.1.0.dev1"]

[tool.hatch.build.targets.wheel]
packages = ["src/slow_thinker_sequence"]
