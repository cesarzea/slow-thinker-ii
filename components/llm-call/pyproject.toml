[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
name = "slow-thinker-llm-call"
version = "0.1.0.dev1"
description = "Single-call, extensible model component for Slow Thinker II."
requires-python = ">=3.13,<3.14"
authors = [{name = "Cesar Zea"}]
dependencies = ["slow-thinker-host==0.1.0.dev1", "openai==3.19.2", "jsonschema>=4.26,<5", "referencing>=0.37,<1", "httpx2>=2.13,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/slow_thinker_llm_call"]
