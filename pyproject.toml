[project]
license = "FSL-1.1-ALv2"
name = "slow-thinker-ii-development"
version = "0.1.0.dev1"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "slow-thinker-ii",
  "slow-thinker-host",
  "slow-thinker-llm-call",
  "slow-thinker-router",
  "slow-thinker-memory",
  "hatchling>=1.27,<2",
  "pip>=25,<27",
  "uv==0.12.23",
  "types-jsonschema>=4,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "import-linter>=2,<3",
  "vulture>=2,<3",
  "mypy>=1.15,<3",
  "mutmut>=3,<4",
  "httpx>=0.28,<1",
  "httpx2>=2.13,<3",
]

[tool.uv.sources]
slow-thinker-ii = { path = "backend", editable = true }
slow-thinker-host = { path = "components/host", editable = true }
slow-thinker-llm-call = { path = "components/llm-call", editable = true }
slow-thinker-router = { path = "components/router", editable = true }
slow-thinker-memory = { path = "components/memory", editable = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["backend/tests", "tooling/tests", "components/host/tests", "components/llm-call/tests", "components/router/tests", "components/memory/tests"]
pythonpath = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend/src/slow_thinker_ii", "tooling/quality", "tooling/components", "components/host/src/slow_thinker_host", "components/llm-call/src/slow_thinker_llm_call", "components/router/src/slow_thinker_router", "components/memory/src/slow_thinker_memory"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "SIM", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["backend/src", "backend/tests", "tooling", "components"]
extraPaths = ["backend/tests"]
exclude = ["**/.cache", "**/.venv", "**/__pycache__", "**/node_modules", "**/site-packages", "**/dist", "**/build", "**/mutants", "docs"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.13"
files = ["backend/src/slow_thinker_ii/contracts", "backend/src/slow_thinker_ii/accounting", "backend/src/slow_thinker_ii/access", "backend/src/slow_thinker_ii/catalog", "backend/src/slow_thinker_ii/graphs", "backend/src/slow_thinker_ii/engine", "backend/src/slow_thinker_ii/application"]
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unused_ignores = true

[tool.vulture]
paths = ["backend/src", "backend/tests", "tooling", "components"]
exclude = ["*/.cache/*", "*/.venv/*", "*/__pycache__/*", "*/node_modules/*", "*/site-packages/*", "*/dist/*", "*/build/*", "*/mutants/*"]
min_confidence = 60
sort_by_size = true

[tool.importlinter]
root_packages = ["slow_thinker_ii", "slow_thinker_host", "slow_thinker_llm_call", "slow_thinker_router", "slow_thinker_memory"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and engine have no framework dependencies"
type = "forbidden"
source_modules = ["slow_thinker_ii.contracts", "slow_thinker_ii.accounting", "slow_thinker_ii.access", "slow_thinker_ii.catalog", "slow_thinker_ii.graphs", "slow_thinker_ii.engine", "slow_thinker_ii.application"]
forbidden_modules = ["fastapi", "sqlite3", "mcp", "openai", "httpx", "pydantic"]

[[tool.importlinter.contracts]]
name = "All backend capabilities follow the dependency direction"
type = "layers"
containers = ["slow_thinker_ii"]
layers = ["bootstrap", "adapters", "application", "engine", "graphs", "catalog | accounting | access", "contracts"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Adapters are independent"
type = "independence"
modules = ["slow_thinker_ii.adapters.sqlite", "slow_thinker_ii.adapters.http", "slow_thinker_ii.adapters.hosts", "slow_thinker_ii.adapters.providers", "slow_thinker_ii.adapters.installations"]

[[tool.importlinter.contracts]]
name = "No Python module cycles"
type = "acyclic_siblings"
ancestors = ["slow_thinker_ii"]

[[tool.importlinter.contracts]]
name = "contracts internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.contracts.*"]
allowed_importers = ["slow_thinker_ii.contracts"]

[[tool.importlinter.contracts]]
name = "accounting internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.accounting.*"]
allowed_importers = ["slow_thinker_ii.accounting"]

[[tool.importlinter.contracts]]
name = "access internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.access.*"]
allowed_importers = ["slow_thinker_ii.access"]

[[tool.importlinter.contracts]]
name = "catalog internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.catalog.*"]
allowed_importers = ["slow_thinker_ii.catalog"]

[[tool.importlinter.contracts]]
name = "graphs internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.graphs.*"]
allowed_importers = ["slow_thinker_ii.graphs"]

[[tool.importlinter.contracts]]
name = "engine internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.engine.*"]
allowed_importers = ["slow_thinker_ii.engine"]

[[tool.importlinter.contracts]]
name = "application internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.application.*"]
allowed_importers = ["slow_thinker_ii.application"]

[[tool.importlinter.contracts]]
name = "adapters.sqlite internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.adapters.sqlite.*"]
allowed_importers = ["slow_thinker_ii.adapters.sqlite"]

[[tool.importlinter.contracts]]
name = "adapters.http internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.adapters.http.*"]
allowed_importers = ["slow_thinker_ii.adapters.http"]

[[tool.importlinter.contracts]]
name = "adapters.hosts internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.adapters.hosts.*"]
allowed_importers = ["slow_thinker_ii.adapters.hosts"]

[[tool.importlinter.contracts]]
name = "adapters.providers internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.adapters.providers.*"]
allowed_importers = ["slow_thinker_ii.adapters.providers"]

[[tool.importlinter.contracts]]
name = "adapters.installations internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.adapters.installations.*"]
allowed_importers = ["slow_thinker_ii.adapters.installations"]

[[tool.importlinter.contracts]]
name = "bootstrap internals are private"
type = "protected"
protected_modules = ["slow_thinker_ii.bootstrap.*"]
allowed_importers = ["slow_thinker_ii.bootstrap"]

[[tool.importlinter.contracts]]
name = "Component packages cannot import the backend"
type = "forbidden"
source_modules = ["slow_thinker_host", "slow_thinker_llm_call", "slow_thinker_router", "slow_thinker_memory"]
forbidden_modules = ["slow_thinker_ii"]

[[tool.importlinter.contracts]]
name = "Backend never imports component implementations"
type = "forbidden"
source_modules = ["slow_thinker_ii"]
forbidden_modules = ["slow_thinker_host", "slow_thinker_llm_call", "slow_thinker_router", "slow_thinker_memory"]

[[tool.importlinter.contracts]]
name = "Host SDK internals are private"
type = "protected"
protected_modules = ["slow_thinker_host.*"]
allowed_importers = ["slow_thinker_host"]

[[tool.importlinter.contracts]]
name = "LLM Call internals are private"
type = "protected"
protected_modules = ["slow_thinker_llm_call.*"]
allowed_importers = ["slow_thinker_llm_call"]

[[tool.importlinter.contracts]]
name = "Router internals are private"
type = "protected"
protected_modules = ["slow_thinker_router.*"]
allowed_importers = ["slow_thinker_router"]

[[tool.importlinter.contracts]]
name = "Memory internals are private"
type = "protected"
protected_modules = ["slow_thinker_memory.*"]
allowed_importers = ["slow_thinker_memory"]
