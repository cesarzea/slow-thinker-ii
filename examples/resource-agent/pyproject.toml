[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
name = "example-resource-agent"
version = "0.1.0"
description = "Independent authored agent consuming explicit resource context."
requires-python = ">=3.13,<3.14"
authors = [{name = "Cesar Zea"}]
dependencies = ["slow-thinker-host==0.1.0.dev1", "slow-thinker-llm-call==0.1.0.dev1"]

[tool.hatch.build.targets.wheel]
packages = ["src/example_resource_agent"]
