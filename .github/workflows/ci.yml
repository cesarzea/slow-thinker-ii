name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          python-version: 3.13.15
      - name: Resolve pinned CodeQL bundle
        id: codeql-bundle
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          policy = json.loads(Path("tooling/quality/codeql/policy.json").read_text())
          version = policy["bundle_version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid CodeQL bundle version")
          url = f"https://github.com/github/codeql-action/releases/download/codeql-bundle-v{version}/codeql-bundle-linux64.tar.gz"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"url={url}\n")
          PY
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        id: codeql
        with:
          tools: ${{ steps.codeql-bundle.outputs.url }}
          languages: python,javascript-typescript
          build-mode: none
          queries: security-and-quality
      - run: make setup
      - run: make verify
        env:
          CODEQL_EXECUTABLE: ${{ steps.codeql.outputs.codeql-path }}
